# superconnect configuration generated by `superconnect init`
# Update figma.file to point to your exact Figma file (ID or URL).

[figma]
file = "<FIGMA_FILE_ID_OR_URL>"
tokenEnv = "FIGMA_PAT"

[code]
root = "src"
tsconfig = "tsconfig.json"

[run]
components = ["Button","Badge","Breadcrumb"]
mode = "simple"

[paths]
artifactsDir = "artifacts"
modulesDir = "modules/code-connect"
